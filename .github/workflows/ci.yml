name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Rebuild the guest test fixture
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path guests/greeter/Cargo.toml
          cp guests/greeter/target/wasm32-unknown-unknown/release/greeter.wasm core/src/test/resources/greeter.wasm

      - name: Build and test
        run: mvn -B --no-transfer-progress verify
